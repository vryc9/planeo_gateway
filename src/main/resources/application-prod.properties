planeo.auth.url=http://planeo-auth:8081
planeo.back.url=http://planeo-back:8082
planeo.admin.url=http://planeo-admin:8083
jwt.secret=${JWT_SECRET:votre_secret_tres_long_au_moins_256_bits_pour_hs256}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Opaque session cookie handed to the browser (BFF pattern)
planeo.session.cookie-name=PLANEO_SID
planeo.session.ttl-seconds=604800
planeo.session.cookie-secure=true